spring:
  application:
    name: frame-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/frame}
    username: ${DB_USERNAME:frame}
    password: ${DB_PASSWORD:frame}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-swallow-size: -1

frame:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32bytes-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  storage:
    root-path: ${STORAGE_ROOT:./data/videos}
  processing:
    provider: ${PROCESSING_PROVIDER:mock}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  seed:
    enabled: ${SEED_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.frame: INFO
    org.springframework.web.socket: INFO
